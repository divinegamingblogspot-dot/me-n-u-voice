<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ME N U Voice</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family: Arial, sans-serif;

  background: #111;

  color: white;

}

.container {

  width: 90%;

  max-width: 500px;

  text-align: center;

}

h1 {

  font-size: 40px;

  margin-bottom: 5px;

}

.subtitle {

  opacity: .6;

  margin-bottom: 40px;

}

#mic {

  width: 150px;

  height: 150px;

  border-radius: 50%;

  border: none;

  font-size: 60px;

  cursor: pointer;

}

#status {

  margin-top: 25px;

  font-size: 18px;

}

#transcript,
#answer {

  margin-top: 20px;

  padding: 20px;

  border-radius: 15px;

  background: #222;

  text-align: left;

  min-height: 50px;

}

.label {

  font-size: 12px;

  opacity: .5;

  margin-bottom: 8px;

}

</style>

</head>


<body>

<div class="container">

<h1>ME N U</h1>

<div class="subtitle">
Voice Interface
</div>

<button id="mic"
        onclick="startVoice()">

🎙️

</button>

<div id="status">
Ready
</div>

<div id="transcript">

<div class="label">
YOU
</div>

Say something...

</div>

<div id="answer">

<div class="label">
ME N U
</div>

Waiting...

</div>

</div>


<script>

// =================================================
// APPS SCRIPT URL
// =================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxiC3YhxK0wiWwgFp_Jptmm40vZriJhgGGpo6JhnHTsFG1dQ8kRzIYHfb-Y3IgwNbjWqQ/exec";


// =================================================
// VOICE RECOGNITION
// =================================================

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    setStatus(
      "❌ Speech recognition not supported"
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  setStatus(
    "🎙️ Listening..."
  );


  recognition.start();


  recognition.onresult =
    function(event) {

      const question =
        event
          .results[0][0]
          .transcript
          .trim();


      document
        .getElementById("transcript")
        .innerHTML =
          '<div class="label">YOU</div>' +
          escapeHTML(question);


      setStatus(
        "🧠 Thinking..."
      );


      sendToAI(question);

    };


  recognition.onerror =
    function(event) {

      setStatus(
        "❌ Voice error: " +
        event.error
      );

    };


  recognition.onend =
    function() {

      document
        .getElementById("mic")
        .classList.remove(
          "listening"
        );

    };

}


// =================================================
// SEND QUESTION TO ME N U
// =================================================

async function sendToAI(question) {

  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain"
          },

          body: JSON.stringify({

            question:
              question

          })

        }
      );


    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "ME N U request failed"
      );

    }


    // =================================================
    // ACTION RESPONSE
    // =================================================

    if (
      data.isAction === true
    ) {

      const actionAnswer =
        data.message ||
        data.answer ||
        "Action completed.";


      showAnswer(
        actionAnswer
      );


      setStatus(
        "🔊 Speaking..."
      );


      speak(
        actionAnswer
      );


      return;

    }


    // =================================================
    // NORMAL AI RESPONSE
    // =================================================

    const answer =
      data.answer ||
      data.message ||
      "I didn't receive an answer.";


    showAnswer(
      answer
    );


    setStatus(
      "🔊 Speaking..."
    );


    speak(
      answer
    );


  }

  catch(error) {

    showAnswer(
      "❌ " +
      error.message
    );


    setStatus(
      "❌ " +
      error.message
    );

  }

}


// =================================================
// DISPLAY ANSWER
// =================================================

function showAnswer(text) {

  document
    .getElementById("answer")
    .innerHTML =
      '<div class="label">ME N U</div>' +
      escapeHTML(text);

}


// =================================================
// TEXT → SPEECH
// =================================================

function speak(text) {

  // Check if browser supports speech synthesis
  if (
    !(
      "speechSynthesis" in window
    )
  ) {

    setStatus(
      "⚠️ Text-to-speech not supported"
    );

    return;

  }


  // Safely cancel previous speech
  try {

    window.speechSynthesis.cancel();

  }

  catch(error) {

    console.log(
      "Speech cancel error:",
      error
    );

  }


  const utterance =
    new SpeechSynthesisUtterance(
      String(text)
    );


  utterance.lang =
    "en-IN";


  utterance.rate =
    1;


  utterance.pitch =
    1;


  utterance.volume =
    1;


  utterance.onend =
    function() {

      setStatus(
        "Ready"
      );

    };


  utterance.onerror =
    function(event) {

      setStatus(
        "❌ Speech error: " +
        event.error
      );

    };


  try {

    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch(error) {

    setStatus(
      "❌ Speech failed: " +
      error.message
    );

  }

}


// =================================================
// SAFE HTML DISPLAY
// =================================================

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    )

    .replace(
      /\n/g,
      "<br>"
    );

}


// =================================================
// STATUS
// =================================================

function setStatus(text) {

  document
    .getElementById("status")
    .innerText =
      text;

}

</script>

</body>

</html>
