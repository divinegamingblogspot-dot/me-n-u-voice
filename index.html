<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>ME N U ❤️</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at top,
      #351525,
      #111 55%
    );

  color: white;

  font-family:
    Arial,
    sans-serif;

  overflow-x: hidden;

}


/* =================================================
   CONTAINER
================================================= */

.container {

  width: 90%;

  max-width: 650px;

  margin: 40px auto;

  text-align: center;

}


/* =================================================
   TITLE
================================================= */

h1 {

  font-size: 45px;

  margin-bottom: 5px;

  letter-spacing: 2px;

}


.subtitle {

  opacity: .6;

  margin-bottom: 20px;

}


/* =================================================
   WELCOME ANIMATION
================================================= */

#welcome {

  min-height: 115px;

  margin: 25px 0;

  font-size: 20px;

  line-height: 1.7;

}


.welcome-line {

  opacity: 0;

  transform:
    translateY(15px);

  animation:
    welcomeIn
    .8s
    forwards;

}


.welcome-line:nth-child(1) {
  animation-delay: .2s;
}

.welcome-line:nth-child(2) {
  animation-delay: 1s;
}

.welcome-line:nth-child(3) {
  animation-delay: 1.8s;
}

.welcome-line:nth-child(4) {
  animation-delay: 2.6s;
}


@keyframes welcomeIn {

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =================================================
   MICROPHONE
================================================= */

#mic {

  width: 120px;

  height: 120px;

  border-radius: 50%;

  border: none;

  font-size: 48px;

  cursor: pointer;

  transition:
    .2s;

}


#mic:hover {

  transform:
    scale(1.05);

}


#mic.listening {

  animation:
    micPulse
    1s
    infinite;

}


@keyframes micPulse {

  0% {

    transform:
      scale(1);

    box-shadow:
      0 0 0 0
      rgba(255,255,255,.3);

  }

  50% {

    transform:
      scale(1.12);

    box-shadow:
      0 0 0 20px
      rgba(255,255,255,0);

  }

  100% {

    transform:
      scale(1);

    box-shadow:
      0 0 0 0
      rgba(255,255,255,0);

  }

}


/* =================================================
   THINKING ANIMATION
================================================= */

#status.thinking::after {

  content:
    "";

  animation:
    dots
    1.5s
    infinite;

}


@keyframes dots {

  0% {
    content: "";
  }

  33% {
    content: ".";
  }

  66% {
    content: "..";
  }

  100% {
    content: "...";
  }

}


/* =================================================
   SPEAKING ANIMATION
================================================= */

#status.speaking {

  animation:
    speakPulse
    1s
    infinite;

}


@keyframes speakPulse {

  0% {
    opacity: .5;
  }

  50% {
    opacity: 1;
  }

  100% {
    opacity: .5;
  }

}


/* =================================================
   STATUS
================================================= */

#status {

  margin: 18px;

  min-height: 22px;

  opacity: .9;

}


/* =================================================
   INPUT
================================================= */

.input-area {

  display: flex;

  gap: 10px;

  margin-top: 25px;

}


#question {

  flex: 1;

  padding: 15px;

  font-size: 17px;

  border-radius: 10px;

  border:
    1px solid #555;

  background:
    #222;

  color:
    white;

  outline:
    none;

}


#question:focus {

  border-color:
    white;

}


#send {

  padding:
    15px 20px;

  border:
    none;

  border-radius:
    10px;

  cursor:
    pointer;

  font-weight:
    bold;

}


/* =================================================
   CARDS
================================================= */

.card {

  background:
    rgba(34,34,34,.92);

  margin-top:
    20px;

  padding:
    20px;

  border-radius:
    14px;

  text-align:
    left;

  line-height:
    1.6;

  word-wrap:
    break-word;

}


.label {

  font-size:
    11px;

  opacity:
    .5;

  margin-bottom:
    10px;

}


/* =================================================
   CONTROLS
================================================= */

.controls {

  display:
    flex;

  flex-wrap:
    wrap;

  justify-content:
    center;

  gap:
    10px;

  margin-top:
    15px;

}


.controlButton {

  padding:
    11px 16px;

  border:
    none;

  border-radius:
    10px;

  cursor:
    pointer;

  font-size:
    14px;

}


#speakButton {

  margin-top:
    15px;

}


/* =================================================
   VOICE SETTINGS
================================================= */

.voice-settings {

  margin-top:
    18px;

  padding:
    15px;

  background:
    rgba(34,34,34,.8);

  border-radius:
    12px;

  text-align:
    left;

}


.voice-settings label {

  display:
    block;

  margin-bottom:
    10px;

  font-size:
    14px;

}


.voice-settings select,
.voice-settings input {

  width:
    100%;

  margin-top:
    5px;

}


/* =================================================
   HISTORY
================================================= */

#history {

  margin-top:
    25px;

}


.history-item {

  background:
    rgba(34,34,34,.7);

  padding:
    15px;

  border-radius:
    10px;

  margin-top:
    10px;

  text-align:
    left;

}


.history-user {

  opacity:
    .75;

  margin-bottom:
    8px;

}


.history-ai {

  line-height:
    1.5;

}


/* =================================================
   MOBILE
================================================= */

@media(max-width:600px) {

  .input-area {

    flex-direction:
      column;

  }

  #send {

    width:
      100%;

  }

  h1 {

    font-size:
      38px;

  }

}

</style>

</head>


<body>


<div class="container">


<h1>
ME N U ❤️
</h1>


<div class="subtitle">
Prince × Niharika
</div>


<!-- =================================================
     WELCOME
================================================= -->

<div id="welcome">

  <div class="welcome-line">
    Hii Niharikaaa ❤️
  </div>

  <div class="welcome-line">
    Hey cutie, finally you're here 😘
  </div>

  <div class="welcome-line">
    I was waiting for you... 👀
  </div>

  <div class="welcome-line">
    Come talk to me, jaan ❤️
  </div>

</div>


<!-- =================================================
     MICROPHONE
================================================= -->

<button
id="mic"
onclick="startVoice()">

🎙️

</button>


<div id="status">
Ready
</div>


<!-- =================================================
     TEXT INPUT
================================================= -->

<div class="input-area">

<input
id="question"
type="text"
placeholder="Say something to Niharika..."
autocomplete="off">

<button
id="send"
onclick="sendText()">

SEND

</button>

</div>


<!-- =================================================
     YOU
================================================= -->

<div
id="transcript"
class="card">

<div class="label">
YOU
</div>

Waiting...

</div>


<!-- =================================================
     AI
================================================= -->

<div
id="answer"
class="card">

<div class="label">
ME N U
</div>

Waiting...

</div>


<!-- =================================================
     SPEAKER CONTROLS
================================================= -->

<div class="controls">

<button
id="speakButton"
class="controlButton"
onclick="speakCurrentAnswer()">

🔊 Speak Answer

</button>


<button
class="controlButton"
onclick="stopSpeaking()">

⏹ Stop

</button>


<button
class="controlButton"
onclick="replayAnswer()">

🔁 Replay

</button>

</div>


<!-- =================================================
     VOICE SETTINGS
================================================= -->

<div class="voice-settings">

<label>

Voice

<select
id="voiceSelect">

<option>
Loading voices...
</option>

</select>

</label>


<label>

Speaking Speed:
<span id="speedValue">
1.0
</span>

<input
id="speed"
type="range"
min="0.5"
max="1.8"
step="0.1"
value="1.0"
oninput="updateSpeed()">

</label>

</div>


<!-- =================================================
     HISTORY
================================================= -->

<div id="history">

<div class="label">
CONVERSATION
</div>

</div>


</div>


<script>


// =================================================
// APPS SCRIPT API
// =================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxiC3YhxK0wiWwgFp_Jptmm40vZriJhgGGpo6JhnHTsFG1dQ8kRzIYHfb-Y3IgwNbjWqQ/exec";


// =================================================
// GLOBALS
// =================================================

let currentAnswer = "";

let voices = [];


// =================================================
// TEXT SEND
// =================================================

function sendText() {

  const input =
    document.getElementById(
      "question"
    );

  const question =
    input.value.trim();

  if (!question) {

    setStatus(
      "⚠️ Say something first."
    );

    return;

  }

  sendToAI(
    question
  );

}


// =================================================
// VOICE RECOGNITION
// =================================================

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    setStatus(
      "❌ Voice recognition unavailable."
    );

    return;

  }

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  const mic =
    document.getElementById(
      "mic"
    );

  mic.classList.add(
    "listening"
  );


  setStatus(
    "🎙️ Listening..."
  );


  try {

    recognition.start();

  }

  catch(error) {

    mic.classList.remove(
      "listening"
    );

    setStatus(
      "❌ Could not start microphone."
    );

    return;

  }


  recognition.onresult =
    function(event) {

      const question =
        event
          .results[0][0]
          .transcript
          .trim();


      document
        .getElementById(
          "question"
        )
        .value =
          question;


      document
        .getElementById(
          "transcript"
        )
        .innerHTML =
          "<div class='label'>YOU</div>" +
          escapeHTML(
            question
          );


      setStatus(
        "✏️ Edit if needed, then press SEND."
      );

    };


  recognition.onerror =
    function(event) {

      setStatus(
        "❌ Voice error: " +
        event.error
      );

    };


  recognition.onend =
    function() {

      mic.classList.remove(
        "listening"
      );

    };

}


// =================================================
// SEND TO AI
// =================================================

async function sendToAI(
  question
) {

  try {

    setThinking(
      true
    );


    document
      .getElementById(
        "transcript"
      )
      .innerHTML =
        "<div class='label'>YOU</div>" +
        escapeHTML(
          question
        );


    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ME N U</div>" +
        "Thinking";


    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              question:
                question

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Unknown server error"
      );

    }


    const answer =
      data.answer ||
      data.message ||
      "No answer received.";


    currentAnswer =
      answer;


    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ME N U</div>" +
        escapeHTML(
          answer
        );


    addHistory(
      question,
      answer
    );


    setThinking(
      false
    );


    setStatus(
      "✅ Answer received."
    );


    /*
      IMPORTANT:

      NO automatic speech here.

      The AI will NOT speak automatically.

      User must press:
      🔊 Speak Answer
    */

  }

  catch(error) {

    setThinking(
      false
    );


    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ERROR</div>" +
        escapeHTML(
          error.message
        );


    setStatus(
      "❌ " +
      error.message
    );

  }

}


// =================================================
// THINKING STATE
// =================================================

function setThinking(
  thinking
) {

  const status =
    document.getElementById(
      "status"
    );

  if (thinking) {

    status.classList.add(
      "thinking"
    );

    status.innerText =
      "🧠 Thinking";

  }

  else {

    status.classList.remove(
      "thinking"
    );

  }

}


// =================================================
// SPEAK ANSWER
// =================================================

function speakCurrentAnswer() {

  if (
    !window.speechSynthesis ||
    !window.SpeechSynthesisUtterance
  ) {

    setStatus(
      "❌ Text-to-speech unavailable."
    );

    return;

  }


  let text =
    currentAnswer;


  if (!text) {

    const answerElement =
      document.getElementById(
        "answer"
      );

    text =
      answerElement.innerText
        .replace(
          "ME N U",
          ""
        )
        .trim();

  }


  if (
    !text ||
    text === "Waiting..." ||
    text === "Thinking"
  ) {

    setStatus(
      "⚠️ Nothing to speak yet."
    );

    return;

  }


  stopSpeaking();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  const selectedVoice =
    document
      .getElementById(
        "voiceSelect"
      )
      .value;


  const selected =
    voices.find(
      function(voice) {

        return voice.name ===
          selectedVoice;

      }
    );


  if (selected) {

    utterance.voice =
      selected;

  }


  utterance.lang =
    "en-IN";


  utterance.rate =
    parseFloat(
      document
        .getElementById(
          "speed"
        )
        .value
    );


  utterance.pitch =
    1;


  utterance.volume =
    1;


  utterance.onstart =
    function() {

      const status =
        document.getElementById(
          "status"
        );

      status.classList.add(
        "speaking"
      );

      status.innerText =
        "🔊 Speaking...";

    };


  utterance.onend =
    function() {

      const status =
        document.getElementById(
          "status"
        );

      status.classList.remove(
        "speaking"
      );

      status.innerText =
        "Ready";

    };


  utterance.onerror =
    function(event) {

      const status =
        document.getElementById(
          "status"
        );

      status.classList.remove(
        "speaking"
      );

      status.innerText =
        "❌ Speech error: " +
        event.error;

    };


  window
    .speechSynthesis
    .speak(
      utterance
    );

}


// =================================================
// STOP SPEAKING
// =================================================

function stopSpeaking() {

  if (
    window.speechSynthesis
  ) {

    window
      .speechSynthesis
      .cancel();

  }


  const status =
    document.getElementById(
      "status"
    );

  status.classList.remove(
    "speaking"
  );

}


// =================================================
// REPLAY
// =================================================

function replayAnswer() {

  if (!currentAnswer) {

    setStatus(
      "⚠️ No answer to replay."
    );

    return;

  }

  speakCurrentAnswer();

}


// =================================================
// LOAD VOICES
// =================================================

function loadVoices() {

  if (
    !window.speechSynthesis
  ) {

    return;

  }


  voices =
    window
      .speechSynthesis
      .getVoices();


  const select =
    document.getElementById(
      "voiceSelect"
    );


  select.innerHTML =
    "";


  if (
    voices.length === 0
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.textContent =
      "Default voice";

    select.appendChild(
      option
    );

    return;

  }


  voices.forEach(
    function(voice) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        voice.name;

      option.textContent =
        voice.name +
        " (" +
        voice.lang +
        ")";

      select.appendChild(
        option
      );

    }
  );


  // Prefer Indian English voice
  const indianVoice =
    voices.find(
      function(voice) {

        return (
          voice.lang
            .toLowerCase()
            .includes("en-in")
        );

      }
    );


  if (indianVoice) {

    select.value =
      indianVoice.name;

  }

}


if (
  window.speechSynthesis
) {

  loadVoices();

  window
    .speechSynthesis
    .onvoiceschanged =
      loadVoices;

}


// =================================================
// SPEED
// =================================================

function updateSpeed() {

  const speed =
    document.getElementById(
      "speed"
    ).value;


  document
    .getElementById(
      "speedValue"
    )
    .innerText =
      speed;

}


// =================================================
// CONVERSATION HISTORY
// =================================================

function addHistory(
  question,
  answer
) {

  const history =
    document.getElementById(
      "history"
    );


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "history-item";


  item.innerHTML =

    "<div class='history-user'>" +
    "❤️ Niharika: " +
    escapeHTML(
      question
    ) +
    "</div>" +

    "<div class='history-ai'>" +
    "😘 Prince: " +
    escapeHTML(
      answer
    ) +
    "</div>";


  history.appendChild(
    item
  );


  // Keep last 20 conversations
  while (
    history.children.length >
    21
  ) {

    history.removeChild(
      history.children[1]
    );

  }

}


// =================================================
// ESCAPE HTML
// =================================================

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    )

    .replace(
      /\n/g,
      "<br>"
    );

}


// =================================================
// STATUS
// =================================================

function setStatus(
  text
) {

  const status =
    document.getElementById(
      "status"
    );

  status.classList.remove(
    "thinking"
  );

  status.innerText =
    text;

}


// =================================================
// ENTER KEY
// =================================================

document
  .getElementById(
    "question"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        sendText();

      }

    }
  );

</script>


</body>

</html>
