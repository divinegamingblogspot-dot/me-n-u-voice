<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>ME N U</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  font-family: Arial, sans-serif;

  background: #111;

  color: white;

}

.container {

  width: 92%;

  max-width: 600px;

  text-align: center;

}

h1 {

  font-size: 42px;

  margin-bottom: 5px;

}

.subtitle {

  opacity: .55;

  margin-bottom: 30px;

}


/* ================================
   VOICE BUTTON
================================ */

#mic {

  width: 130px;

  height: 130px;

  border-radius: 50%;

  border: none;

  font-size: 55px;

  cursor: pointer;

  margin-bottom: 20px;

}

#mic:active {

  transform: scale(.95);

}


/* ================================
   STATUS
================================ */

#status {

  margin: 15px 0;

  font-size: 17px;

}


/* ================================
   TEXT INPUT
================================ */

.input-area {

  display: flex;

  gap: 10px;

  margin-top: 20px;

}

#question {

  flex: 1;

  padding: 16px;

  border-radius: 12px;

  border: none;

  outline: none;

  font-size: 16px;

  background: #222;

  color: white;

}


#send {

  padding: 0 20px;

  border: none;

  border-radius: 12px;

  cursor: pointer;

  font-weight: bold;

}


/* ================================
   CARDS
================================ */

.card {

  margin-top: 20px;

  padding: 20px;

  border-radius: 15px;

  background: #222;

  text-align: left;

  min-height: 60px;

}

.label {

  font-size: 11px;

  opacity: .5;

  margin-bottom: 8px;

}


/* ================================
   BUTTONS
================================ */

.quick-buttons {

  display: flex;

  gap: 10px;

  margin-top: 15px;

  flex-wrap: wrap;

  justify-content: center;

}

.quick-buttons button {

  padding: 10px 14px;

  border-radius: 10px;

  border: none;

  cursor: pointer;

}


/* ================================
   MOBILE
================================ */

@media (max-width: 500px) {

  h1 {

    font-size: 34px;

  }

  #mic {

    width: 110px;

    height: 110px;

    font-size: 45px;

  }

  .input-area {

    flex-direction: column;

  }

  #send {

    padding: 14px;

  }

}

</style>

</head>


<body>


<div class="container">


<h1>
ME N U
</h1>


<div class="subtitle">
Voice + Text Control Center
</div>


<!-- ================================
     MICROPHONE
================================ -->


<button
  id="mic"
  onclick="startVoice()">

🎙️

</button>


<div id="status">
Ready
</div>


<!-- ================================
     TEXT INPUT
================================ -->


<div class="input-area">

<input
  id="question"
  type="text"
  placeholder="Type or edit your command..."
  autocomplete="off"
>


<button
  id="send"
  onclick="sendTypedQuestion()">

SEND

</button>

</div>


<!-- ================================
     QUICK COMMANDS
================================ -->


<div class="quick-buttons">

<button
  onclick="quickCommand('How many coins do I have?')">

💰 Coins

</button>


<button
  onclick="quickCommand('What is my relationship level?')">

❤️ Level

</button>


<button
  onclick="quickCommand('Mark all Prince tasks completed')">

☑️ Prince Tasks

</button>


</div>


<!-- ================================
     YOU
================================ -->


<div
  id="transcript"
  class="card">

<div class="label">
YOU
</div>

Nothing yet.

</div>


<!-- ================================
     ME N U
================================ -->


<div
  id="answer"
  class="card">

<div class="label">
ME N U
</div>

Waiting...

</div>


</div>


<script>


// =================================================
// APPS SCRIPT URL
// =================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxiC3YhxK0wiWwgFp_Jptmm40vZriJhgGGpo6JhnHTsFG1dQ8kRzIYHfb-Y3IgwNbjWqQ/exec";


// =================================================
// VOICE INPUT
// =================================================

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    setStatus(
      "❌ Voice recognition unavailable"
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  setStatus(
    "🎙️ Listening..."
  );


  recognition.start();


  recognition.onresult =
    function(event) {

      const text =
        event
          .results[0][0]
          .transcript
          .trim();


      // Put voice transcription
      // INTO THE EDITABLE TEXT BOX

      document
        .getElementById("question")
        .value =
          text;


      document
        .getElementById("transcript")
        .innerHTML =
          '<div class="label">YOU</div>' +
          escapeHTML(text);


      setStatus(
        "✏️ Edit it or press SEND"
      );

    };


  recognition.onerror =
    function(event) {

      setStatus(
        "❌ Voice error: " +
        event.error
      );

    };


  recognition.onend =
    function() {

      console.log(
        "Voice recognition ended"
      );

    };

}


// =================================================
// SEND TYPED TEXT
// =================================================

function sendTypedQuestion() {

  const input =
    document
      .getElementById("question");


  const question =
    input.value.trim();


  if (!question) {

    setStatus(
      "⚠️ Type something first"
    );

    return;

  }


  sendToAI(
    question
  );

}


// =================================================
// QUICK COMMAND
// =================================================

function quickCommand(command) {

  document
    .getElementById("question")
    .value =
      command;


  sendToAI(
    command
  );

}


// =================================================
// SEND TO APPS SCRIPT
// =================================================

async function sendToAI(question) {

  try {

    setStatus(
      "🧠 Thinking..."
    );


    document
      .getElementById("transcript")
      .innerHTML =
        '<div class="label">YOU</div>' +
        escapeHTML(question);


    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain"

          },

          body:
            JSON.stringify({

              question:
                question

            })

        }

      );


    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "ME N U request failed"
      );

    }


    // ==============================================
    // ACTION RESPONSE
    // ==============================================

    if (
      data.isAction === true
    ) {

      const message =
        data.message ||
        "Action completed.";


      showAnswer(
        message
      );


      speak(
        message
      );


      return;

    }


    // ==============================================
    // NORMAL AI RESPONSE
    // ==============================================

    const answer =
      data.answer ||
      data.message ||
      "No answer received.";


    showAnswer(
      answer
    );


    speak(
      answer
    );


  }

  catch(error) {

    showAnswer(
      "❌ " +
      error.message
    );


    setStatus(
      "❌ " +
      error.message
    );

  }

}


// =================================================
// SHOW ANSWER
// =================================================

function showAnswer(text) {

  document
    .getElementById("answer")
    .innerHTML =
      '<div class="label">ME N U</div>' +
      escapeHTML(text);

}


// =================================================
// TEXT → SPEECH
// =================================================

function speak(text) {

  const synth =
    window.speechSynthesis;


  if (
    !synth ||
    typeof synth.speak !==
    "function"
  ) {

    setStatus(
      "⚠️ Text-to-speech unavailable"
    );

    return;

  }


  const utterance =
    new SpeechSynthesisUtterance(
      String(text)
    );


  utterance.lang =
    "en-IN";


  utterance.rate =
    1;


  utterance.pitch =
    1;


  utterance.volume =
    1;


  utterance.onstart =
    function() {

      setStatus(
        "🔊 Speaking..."
      );

    };


  utterance.onend =
    function() {

      setStatus(
        "Ready"
      );

    };


  utterance.onerror =
    function(event) {

      setStatus(
        "❌ Speech error: " +
        event.error
      );

    };


  try {

    synth.speak(
      utterance
    );

  }

  catch(error) {

    setStatus(
      "❌ Speech failed: " +
      error.message
    );

  }

}


// =================================================
// SAFE HTML
// =================================================

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    )

    .replace(
      /\n/g,
      "<br>"
    );

}


// =================================================
// STATUS
// =================================================

function setStatus(text) {

  document
    .getElementById("status")
    .innerText =
      text;

}


// =================================================
// ENTER KEY
// =================================================

document
  .getElementById("question")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        sendTypedQuestion();

      }

    }
  );

</script>


</body>

</html>
