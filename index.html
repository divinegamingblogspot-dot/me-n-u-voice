<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>ME N U</title>

<style>

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 90%;
  max-width: 600px;
  margin: 50px auto;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 5px;
}

.subtitle {
  opacity: .6;
  margin-bottom: 25px;
}

#status {
  margin: 20px;
  min-height: 22px;
}

#mic {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: none;
  font-size: 50px;
  cursor: pointer;
}

#mic:hover {
  transform: scale(1.03);
}

.input-area {
  display: flex;
  gap: 10px;
  margin-top: 30px;
}

#question {

  flex: 1;

  padding: 15px;

  font-size: 18px;

  border-radius: 10px;

  border: 1px solid #555;

  background: #222;

  color: white;

  outline: none;

}

#question:focus {
  border-color: white;
}

#send {

  padding: 15px 20px;

  border: none;

  border-radius: 10px;

  cursor: pointer;

  font-weight: bold;

}

#speakButton {

  margin-top: 12px;

  padding: 12px 20px;

  border: none;

  border-radius: 10px;

  cursor: pointer;

  font-size: 15px;

}

.card {

  background: #222;

  margin-top: 20px;

  padding: 20px;

  border-radius: 12px;

  text-align: left;

  line-height: 1.5;

}

.label {

  font-size: 11px;

  opacity: .5;

  margin-bottom: 10px;

}

</style>

</head>


<body>


<div class="container">


<h1>
ME N U
</h1>


<div class="subtitle">
Voice + Text
</div>


<!-- =================================================
     MICROPHONE
================================================= -->

<button
id="mic"
onclick="startVoice()">

🎙️

</button>


<div id="status">
Ready
</div>


<!-- =================================================
     TEXT INPUT
================================================= -->

<div class="input-area">

<input
id="question"
type="text"
placeholder="Type or edit your question..."
autocomplete="off">

<button
id="send"
onclick="sendText()">

SEND

</button>

</div>


<!-- =================================================
     YOUR VOICE / QUESTION
================================================= -->

<div
id="transcript"
class="card">

<div class="label">
YOU
</div>

Waiting...

</div>


<!-- =================================================
     AI ANSWER
================================================= -->

<div
id="answer"
class="card">

<div class="label">
ME N U
</div>

Waiting...

</div>


<!-- =================================================
     MANUAL SPEAK BUTTON
================================================= -->

<button
id="speakButton"
onclick="speakCurrentAnswer()">

🔊 Speak Answer

</button>


</div>


<script>


// =================================================
// YOUR APPS SCRIPT URL
// =================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxiC3YhxK0wiWwgFp_Jptmm40vZriJhgGGpo6JhnHTsFG1dQ8kRzIYHfb-Y3IgwNbjWqQ/exec";


// =================================================
// TEXT SEND
// =================================================

function sendText() {

  const input =
    document.getElementById(
      "question"
    );


  const question =
    input.value.trim();


  if (!question) {

    setStatus(
      "⚠️ Type something first."
    );

    return;

  }


  sendToAI(
    question
  );

}


// =================================================
// VOICE
// =================================================

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    setStatus(
      "❌ Voice recognition unavailable."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  setStatus(
    "🎙️ Listening..."
  );


  try {

    recognition.start();

  }

  catch(error) {

    setStatus(
      "❌ Could not start microphone."
    );

    return;

  }


  recognition.onresult =
    function(event) {

      const question =
        event
          .results[0][0]
          .transcript
          .trim();


      // =============================================
      // PUT VOICE INTO EDITABLE TEXT BOX
      // =============================================

      document
        .getElementById(
          "question"
        )
        .value =
          question;


      // =============================================
      // SHOW TRANSCRIPTION
      // =============================================

      document
        .getElementById(
          "transcript"
        )
        .innerHTML =
          "<div class='label'>YOU</div>" +
          escapeHTML(
            question
          );


      // =============================================
      // DO NOT SEND AUTOMATICALLY
      // =============================================

      setStatus(
        "✏️ Edit if needed, then press SEND."
      );

    };


  recognition.onerror =
    function(event) {

      setStatus(
        "❌ Voice error: " +
        event.error
      );

    };


  recognition.onend =
    function() {

      console.log(
        "Voice recognition ended."
      );

    };

}


// =================================================
// SEND TO APPS SCRIPT
// =================================================

async function sendToAI(question) {

  try {

    setStatus(
      "🧠 Thinking..."
    );


    // =============================================
    // SHOW QUESTION
    // =============================================

    document
      .getElementById(
        "transcript"
      )
      .innerHTML =
        "<div class='label'>YOU</div>" +
        escapeHTML(
          question
        );


    // =============================================
    // CLEAR OLD ANSWER
    // =============================================

    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ME N U</div>" +
        "Thinking...";


    // =============================================
    // SEND REQUEST
    // =============================================

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              question:
                question

            })

        }
      );


    // =============================================
    // CHECK SERVER
    // =============================================

    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    // =============================================
    // READ RESPONSE
    // =============================================

    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Unknown server error"
      );

    }


    // =============================================
    // GET ANSWER
    // =============================================

    const answer =
      data.answer ||
      data.message ||
      "No answer received.";


    // =============================================
    // SHOW ANSWER
    // =============================================

    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ME N U</div>" +
        escapeHTML(
          answer
        );


    // =============================================
    // IMPORTANT:
    // NO AUTOMATIC SPEAKING
    // =============================================

    setStatus(
      "✅ Answer received. Press 🔊 to hear it."
    );


  }

  catch(error) {

    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ERROR</div>" +
        escapeHTML(
          error.message
        );


    setStatus(
      "❌ " +
      error.message
    );

  }

}


// =================================================
// MANUAL SPEAK CURRENT ANSWER
// =================================================

function speakCurrentAnswer() {

  // ===============================================
  // CHECK BROWSER SUPPORT
  // ===============================================

  if (
    !window.speechSynthesis ||
    !window.SpeechSynthesisUtterance
  ) {

    setStatus(
      "❌ Text-to-speech unavailable."
    );

    return;

  }


  // ===============================================
  // GET ANSWER TEXT
  // ===============================================

  const answerElement =
    document.getElementById(
      "answer"
    );


  let text =
    answerElement.innerText;


  // Remove ME N U label

  text =
    text
      .replace(
        "ME N U",
        ""
      )
      .trim();


  if (
    !text ||
    text === "Waiting..." ||
    text === "Thinking..."
  ) {

    setStatus(
      "⚠️ Nothing to speak yet."
    );

    return;

  }


  // ===============================================
  // CREATE VOICE
  // ===============================================

  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "en-IN";


  utterance.rate =
    1;


  utterance.pitch =
    1;


  utterance.volume =
    1;


  utterance.onstart =
    function() {

      setStatus(
        "🔊 Speaking..."
      );

    };


  utterance.onend =
    function() {

      setStatus(
        "Ready"
      );

    };


  utterance.onerror =
    function(event) {

      setStatus(
        "❌ Speech error: " +
        event.error
      );

    };


  // ===============================================
  // START SPEAKING
  // ===============================================

  try {

    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch(error) {

    setStatus(
      "❌ Speech failed."
    );

  }

}


// =================================================
// SAFE HTML
// =================================================

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    )

    .replace(
      /\n/g,
      "<br>"
    );

}


// =================================================
// STATUS
// =================================================

function setStatus(text) {

  document
    .getElementById(
      "status"
    )
    .innerText =
      text;

}


// =================================================
// ENTER KEY
// =================================================

document
  .getElementById(
    "question"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        sendText();

      }

    }
  );

</script>


</body>

</html>
