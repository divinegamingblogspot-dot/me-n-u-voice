<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>ME N U</title>

<style>

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 90%;
  max-width: 600px;
  margin: 50px auto;
  text-align: center;
}

h1 {
  font-size: 42px;
}

#status {
  margin: 20px;
}

#mic {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: none;
  font-size: 50px;
  cursor: pointer;
}

.input-area {
  display: flex;
  gap: 10px;
  margin-top: 30px;
}

#question {

  flex: 1;

  padding: 15px;

  font-size: 18px;

  border-radius: 10px;

  border: 1px solid #555;

  background: #222;

  color: white;

  outline: none;

}

#send {

  padding: 15px 20px;

  border: none;

  border-radius: 10px;

  cursor: pointer;

}

.card {

  background: #222;

  margin-top: 20px;

  padding: 20px;

  border-radius: 12px;

  text-align: left;

}

.label {

  font-size: 11px;

  opacity: .5;

  margin-bottom: 10px;

}

</style>

</head>


<body>


<div class="container">


<h1>
ME N U
</h1>


<div>
Voice + Text
</div>


<button
id="mic"
onclick="startVoice()">

🎙️

</button>


<div id="status">
Ready
</div>


<!-- TEXT INPUT -->

<div class="input-area">

<input
id="question"
type="text"
placeholder="Type your question..."
autocomplete="off">

<button
id="send"
onclick="sendText()">

SEND

</button>

</div>


<div
id="transcript"
class="card">

<div class="label">
YOU
</div>

Waiting...

</div>


<div
id="answer"
class="card">

<div class="label">
ME N U
</div>

Waiting...

</div>


</div>


<script>


// =================================================
// YOUR APPS SCRIPT URL
// =================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxiC3YhxK0wiWwgFp_Jptmm40vZriJhgGGpo6JhnHTsFG1dQ8kRzIYHfb-Y3IgwNbjWqQ/exec";


// =================================================
// TEXT SEND
// =================================================

function sendText() {

  const input =
    document.getElementById(
      "question"
    );


  const question =
    input.value.trim();


  if (!question) {

    setStatus(
      "Type something first."
    );

    return;

  }


  sendToAI(question);

}


// =================================================
// VOICE
// =================================================

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    setStatus(
      "Voice recognition unavailable."
    );

    return;

  }


  const recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  setStatus(
    "🎙️ Listening..."
  );


  recognition.start();


  recognition.onresult =
    function(event) {

      const question =
        event
          .results[0][0]
          .transcript
          .trim();


      // PUT VOICE INTO TEXT BOX

      document
        .getElementById(
          "question"
        )
        .value =
          question;


      document
        .getElementById(
          "transcript"
        )
        .innerHTML =
          "<div class='label'>YOU</div>" +
          escapeHTML(question);


      setStatus(
        "✏️ Edit the text or press SEND"
      );

    };


  recognition.onerror =
    function(event) {

      setStatus(
        "❌ Voice error: " +
        event.error
      );

    };

}


// =================================================
// SEND TO APPS SCRIPT
// =================================================

async function sendToAI(question) {

  try {

    setStatus(
      "🧠 Thinking..."
    );


    document
      .getElementById(
        "transcript"
      )
      .innerHTML =
        "<div class='label'>YOU</div>" +
        escapeHTML(question);


    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              question:
                question

            })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.error ||
        "Unknown server error"
      );

    }


    const answer =
      data.answer ||
      data.message ||
      "No answer received.";


    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ME N U</div>" +
        escapeHTML(answer);


    setStatus(
      "🔊 Speaking..."
    );


    speak(answer);


  }

  catch(error) {

    document
      .getElementById(
        "answer"
      )
      .innerHTML =
        "<div class='label'>ERROR</div>" +
        escapeHTML(
          error.message
        );


    setStatus(
      "❌ " +
      error.message
    );

  }

}


// =================================================
// SPEAK
// =================================================

function speak(text) {

  if (
    !window.speechSynthesis ||
    !window.SpeechSynthesisUtterance
  ) {

    setStatus(
      "Answer received."
    );

    return;

  }


  const utterance =
    new SpeechSynthesisUtterance(
      String(text)
    );


  utterance.lang =
    "en-IN";


  utterance.rate =
    1;


  utterance.pitch =
    1;


  utterance.volume =
    1;


  utterance.onend =
    function() {

      setStatus(
        "Ready"
      );

    };


  try {

    window
      .speechSynthesis
      .speak(
        utterance
      );

  }

  catch(error) {

    setStatus(
      "Answer received."
    );

  }

}


// =================================================
// SAFE HTML
// =================================================

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    )

    .replace(
      /\n/g,
      "<br>"
    );

}


// =================================================
// STATUS
// =================================================

function setStatus(text) {

  document
    .getElementById(
      "status"
    )
    .innerText =
      text;

}


// =================================================
// ENTER KEY
// =================================================

document
  .getElementById(
    "question"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        sendText();

      }

    }
  );

</script>


</body>

</html>
